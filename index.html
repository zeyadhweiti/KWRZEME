<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>معرض الصور الكروي 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: radial-gradient(circle at center, #0a0a1a 0%, #000 100%);
      color: #fff;
      overflow: hidden;
      height: 100vh;
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    canvas { display: block; width: 100%; height: 100%; }

    .controls {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 20px;
      width: 300px;
      z-index: 100;
    }

    .controls h1 {
      font-size: 18px;
      margin-bottom: 8px;
      color: #3b82f6;
    }

    .controls p {
      font-size: 12px;
      color: #aaa;
      margin-bottom: 16px;
      line-height: 1.6;
    }

    .control-group {
      margin-bottom: 14px;
    }

    .control-group label {
      display: block;
      font-size: 12px;
      color: #ccc;
      margin-bottom: 6px;
    }

    .control-group input[type="range"] {
      width: 100%;
      accent-color: #3b82f6;
    }

    .value-display {
      display: inline-block;
      background: rgba(59,130,246,0.2);
      color: #3b82f6;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      margin-right: 8px;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    button {
      flex: 1;
      min-width: 80px;
      padding: 10px;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .btn-primary {
      background: #3b82f6;
      color: #fff;
    }
    .btn-primary:hover { background: #2563eb; transform: translateY(-1px); }

    .btn-secondary {
      background: rgba(255,255,255,0.1);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.2); }

    .btn-danger {
      background: #ef4444;
      color: #fff;
    }

    input[type="file"] { display: none; }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.9);
      z-index: 200;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .modal img {
      max-width: 80%;
      max-height: 70vh;
      border-radius: 16px;
      box-shadow: 0 25px 80px rgba(0,0,0,0.6);
    }

    .modal-info {
      margin-top: 20px;
      text-align: center;
    }

    .modal-info h3 { color: #fff; font-size: 18px; }
    .modal-info p { color: #aaa; font-size: 13px; margin-top: 6px; }

    .stats {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 12px;
      color: #aaa;
    }

    .hint {
      position: absolute;
      bottom: 20px;
      right: 20px;
      font-size: 11px;
      color: rgba(255,255,255,0.4);
    }
  </style>
</head>
<body>

<div id="canvas-container">
  <canvas id="gl-canvas"></canvas>

  <div class="controls">
    <h1>🖼️ معرض الصور الكروي</h1>
    <p>اسحب للدوران · عجلة الماوس للتكبير · انقر على نقطة زرقاء لعرض الصورة</p>

    <div class="control-group">
      <label>🔵 نصف قطر الكرة <span class="value-display" id="val-R">60</span></label>
      <input type="range" id="slider-R" min="30" max="100" value="60">
    </div>

    <div class="control-group">
      <label>📐 دقة التقسيم <span class="value-display" id="val-n">20</span></label>
      <input type="range" id="slider-n" min="10" max="40" value="20">
    </div>

    <div class="btn-group">
      <button class="btn-primary" onclick="document.getElementById('file-input').click()">
        📤 رفع صورة
      </button>
      <button class="btn-secondary" onclick="toggleRotation()">
        <span id="rotate-icon">▶️</span> دوران
      </button>
      <button class="btn-secondary" onclick="resetView()">🔄 إعادة</button>
    </div>

    <div class="btn-group" style="margin-top:8px;">
      <button class="btn-danger" onclick="clearImages()" style="flex:1;">🗑️ مسح الكل</button>
    </div>
  </div>

  <div class="stats" id="stats">
    النقاط: 0 | الصور المحملة: 0
  </div>

  <div class="hint">Three.js + Spherical Coordinates</div>
</div>

<input type="file" id="file-input" accept="image/*" multiple onchange="handleFiles(this.files)">

<div class="modal" id="modal" onclick="closeModal()">
  <img id="modal-img" src="" alt="صورة">
  <div class="modal-info">
    <h3 id="modal-title">عنوان الصورة</h3>
    <p id="modal-coords">الإحداثيات الكروية</p>
  </div>
  <button class="btn-secondary" style="margin-top:20px;" onclick="event.stopPropagation(); closeModal()">
    إغلاق
  </button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

const container = document.getElementById('canvas-container');
const canvas = document.getElementById('gl-canvas');

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000000, 0.002);

const camera = new THREE.PerspectiveCamera(
  60,
  container.clientWidth / container.clientHeight,
  0.1,
  1000
);
camera.position.set(0, 0, 180);

const renderer = new THREE.WebGLRenderer({ 
  canvas, 
  antialias: true,
  alpha: true 
});
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambientLight);

const mainLight = new THREE.PointLight(0x3b82f6, 1.5, 500);
mainLight.position.set(150, 100, 150);
scene.add(mainLight);

const accentLight = new THREE.PointLight(0xff6b6b, 0.8, 400);
accentLight.position.set(-150, -100, 100);
scene.add(accentLight);

const worldGroup = new THREE.Group();
scene.add(worldGroup);

const sphereGroup = new THREE.Group();
worldGroup.add(sphereGroup);

const markersGroup = new THREE.Group();
worldGroup.add(markersGroup);

let R = 60;
let n = 20;
let autoRotate = false;
let imageSlots = [];
let loadedImages = 0;

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

function createSphere() {
  while(sphereGroup.children.length > 0) {
    sphereGroup.remove(sphereGroup.children[0]);
  }

  const geo = new THREE.SphereGeometry(R, 40, 40);
  const mat = new THREE.MeshBasicMaterial({
    color: 0x1a1a3a,
    wireframe: true,
    transparent: true,
    opacity: 0.25
  });
  const wireSphere = new THREE.Mesh(geo, mat);
  sphereGroup.add(wireSphere);

  const innerGeo = new THREE.SphereGeometry(R * 0.98, 40, 40);
  const innerMat = new THREE.MeshBasicMaterial({
    color: 0x0a0a1f,
    transparent: true,
    opacity: 0.6,
    side: THREE.BackSide
  });
  sphereGroup.add(new THREE.Mesh(innerGeo, innerMat));
}

function calculateSphericalPoints() {
  const points = [];

  for (let i = 0; i <= n; i++) {
    const phi = (i / n) * Math.PI;

    for (let j = 0; j <= n; j++) {
      const theta = (j / n) * 2 * Math.PI;

      const x = R * Math.sin(phi) * Math.cos(theta);
      const y = R * Math.cos(phi);
      const z = R * Math.sin(phi) * Math.sin(theta);

      points.push({
        position: new THREE.Vector3(x, y, z),
        phi, theta,
        i, j,
        occupied: false,
        image: null
      });
    }
  }
  return points;
}

function placeMarkers() {
  while(markersGroup.children.length > 0) {
    markersGroup.remove(markersGroup.children[0]);
  }

  imageSlots = calculateSphericalPoints();

  const displaySlots = imageSlots.filter((_, idx) => idx % 3 === 0);

  displaySlots.forEach((slot, idx) => {
    const hasImg = slot.occupied;

    const markerGeo = new THREE.SphereGeometry(hasImg ? 2.2 : 1.2, 12, 12);
    const markerMat = new THREE.MeshPhongMaterial({
      color: hasImg ? 0x3b82f6 : 0x555555,
      emissive: hasImg ? 0x1a4a8a : 0x000000,
      shininess: 100,
      transparent: true,
      opacity: hasImg ? 1 : 0.4
    });
    const marker = new THREE.Mesh(markerGeo, markerMat);
    marker.position.copy(slot.position);
    marker.userData = { 
      slotIndex: imageSlots.indexOf(slot),
      hasImage: hasImg,
      slot: slot
    };
    markersGroup.add(marker);

    if (hasImg) {
      const ringGeo = new THREE.RingGeometry(3, 3.8, 20);
      const ringMat = new THREE.MeshBasicMaterial({
        color: 0x3b82f6,
        transparent: true,
        opacity: 0.4,
        side: THREE.DoubleSide
      });
      const ring = new THREE.Mesh(ringGeo, ringMat);
      ring.position.copy(slot.position).multiplyScalar(1.03);
      ring.lookAt(0, 0, 0);
      markersGroup.add(ring);
    }
  });

  updateStats();
}

window.handleFiles = function(files) {
  Array.from(files).forEach(file => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const emptySlot = imageSlots.find(s => !s.occupied);
      if (emptySlot) {
        emptySlot.occupied = true;
        emptySlot.image = {
          src: e.target.result,
          name: file.name,
          size: (file.size / 1024).toFixed(1) + ' KB'
        };
        loadedImages++;
        placeMarkers();
      }
    };
    reader.readAsDataURL(file);
  });
};

let isDragging = false;
let prevPos = { x: 0, y: 0 };

canvas.addEventListener('mousedown', e => {
  isDragging = true;
  prevPos = { x: e.clientX, y: e.clientY };
});

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

  if (isDragging) {
    const dx = e.clientX - prevPos.x;
    const dy = e.clientY - prevPos.y;
    worldGroup.rotation.y += dx * 0.005;
    worldGroup.rotation.x += dy * 0.005;
    prevPos = { x: e.clientX, y: e.clientY };
  }
});

canvas.addEventListener('mouseup', () => isDragging = false);
canvas.addEventListener('mouseleave', () => isDragging = false);

canvas.addEventListener('click', e => {
  if (isDragging) return;

  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(markersGroup.children);

  if (hits.length > 0) {
    const obj = hits[0].object;
    const data = obj.userData;

    if (data.hasImage && data.slot.image) {
      showModal(data.slot.image, data.slot);
    }
  }
});

function showModal(imgData, slot) {
  document.getElementById('modal-img').src = imgData.src;
  document.getElementById('modal-title').textContent = imgData.name;

  const phiDeg = (slot.phi * 180 / Math.PI).toFixed(1);
  const thetaDeg = (slot.theta * 180 / Math.PI).toFixed(1);
  document.getElementById('modal-coords').textContent = 
    `📍 φ=${phiDeg}° | θ=${thetaDeg}° | ${imgData.size}`;

  document.getElementById('modal').style.display = 'flex';
}

window.closeModal = function() {
  document.getElementById('modal').style.display = 'none';
};

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  camera.position.z += e.deltaY * 0.15;
  camera.position.z = Math.max(100, Math.min(400, camera.position.z));
});

window.toggleRotation = function() {
  autoRotate = !autoRotate;
  document.getElementById('rotate-icon').textContent = autoRotate ? '⏸️' : '▶️';
};

window.resetView = function() {
  worldGroup.rotation.set(0, 0, 0);
  camera.position.set(0, 0, 180);
  autoRotate = false;
  document.getElementById('rotate-icon').textContent = '▶️';
};

window.clearImages = function() {
  imageSlots.forEach(s => { s.occupied = false; s.image = null; });
  loadedImages = 0;
  placeMarkers();
};

document.getElementById('slider-R').addEventListener('input', e => {
  R = parseInt(e.target.value);
  document.getElementById('val-R').textContent = R;
  createSphere();
  placeMarkers();
});

document.getElementById('slider-n').addEventListener('input', e => {
  n = parseInt(e.target.value);
  document.getElementById('val-n').textContent = n;
  placeMarkers();
});

function updateStats() {
  const total = (n + 1) * (n + 1);
  document.getElementById('stats').textContent = 
    `النقاط: ${total} | الصور المحملة: ${loadedImages} | المتاحة: ${total - loadedImages}`;
}

function animate() {
  requestAnimationFrame(animate);

  if (autoRotate) {
    worldGroup.rotation.y += 0.003;
  }

  const time = Date.now() * 0.001;
  markersGroup.children.forEach((child, i) => {
    if (child.userData && child.userData.hasImage) {
      const s = 1 + Math.sin(time * 2 + i) * 0.15;
      child.scale.setScalar(s);
    }
  });

  renderer.render(scene, camera);
}

createSphere();
placeMarkers();
animate();

window.addEventListener('resize', () => {
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});

function addDemoImages() {
  const colors = ['#ff6b6b','#4ecdc4','#45b7d1','#96ceb4','#ffeaa7','#fd79a8'];
  colors.forEach((color, i) => {
    const c = document.createElement('canvas');
    c.width = 300; c.height = 300;
    const ctx = c.getContext('2d');
    ctx.fillStyle = color;
    ctx.fillRect(0,0,300,300);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 30px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(`صورة ${i+1}`, 150, 160);

    const slot = imageSlots.find(s => !s.occupied);
    if (slot) {
      slot.occupied = true;
      slot.image = { src: c.toDataURL(), name: `صورة تجريبية ${i+1}`, size: '~15 KB' };
      loadedImages++;
    }
  });
  placeMarkers();
}

setTimeout(addDemoImages, 500);
</script>
</body>
</html>
